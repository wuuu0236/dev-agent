# CI：每次 push 自动跑核心逻辑的确定性测试（不调 LLM，无需任何密钥）。
#
# 设计取舍：
#   · 装最小依赖（requirements-dev.txt）而非完整 requirements.txt——
#     重型组件（OCR/评估/前端）留给本地，CI 快而稳。
#   · 只测「不调 LLM、不碰数据库」的纯逻辑，密钥永远不进 CI。
#   · 静态检查放在测试之前：它比测试便宜得多，能早一步给出更准的错误位置。
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装静态检查工具
        # ⚠️ 版本号必须加引号：裸写 `pyflakes>=3.0` 时 shell 会把 `>` 当重定向，
        # 于是变成「装个无版本约束的 pyflakes，并把输出写进名叫 `=3.0` 的文件」。
        run: python -m pip install "pyflakes>=3.0"

      # 只报「未定义名 / 未使用导入 / 重复定义 / 空 f-string」，不带风格规则噪音。
      # 为什么值得单开一个 job：一个真实事故——`_get_ollama_client` 里把 `OpenAI` 写成
      # 了不存在的 `OpenAIClient`，云端路径完全正常、只有选 ollama 时才 NameError，
      # 于是被宣传的「本地私有化 / 离线」一直是死的，谁都没发现。测试覆盖不到
      # （那条路径本机跑不了），pyflakes 一行就报出来。
      # 注：挂闸门前先把历史告警清零过一次（原 17 条），以保证这个 job 现在就是绿的。
      - name: 静态检查
        run: python -m pyflakes src/ pages/ app.py scripts/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 跑冒烟测试
        run: python -m pytest tests/ -v
